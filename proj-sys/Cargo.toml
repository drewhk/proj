[package]
name = "proj-sys"
description = "Rust bindings for PROJ v9.6.x"
repository = "https://github.com/georust/proj"
version = "0.26.0"
readme = "README.md"
authors = ["The Georust developers <mods@georust.org>"]
keywords = ["proj", "projection", "osgeo", "geo", "geospatial"]
license = "MIT OR Apache-2.0"
edition = "2021"
links = "proj"
rust-version = "1.82"

[dependencies]
libsqlite3-sys = { version = ">=0.28,<0.36", features = ["bundled"] }
libz-sys = { version = "1.1.22", default-features = false, features = ["zlib-ng", "static"] }
link-cplusplus = "1.0.6"

[build-dependencies]
bindgen = { version = "0.72.0" }
pkg-config = "0.3.25"
cmake = "0.1.50"
flate2 = "1.1.1"
tar = "0.4.40"

[features]
nobuild = []
bundled_proj = []
# `pkg_config` feature is deprecated and does nothing
pkg_config = []
network = ["tiff"]
tiff = []

[package.metadata.docs.rs]
features = [ "nobuild" ] # This feature will be enabled during the docs.rs build

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bundled_build)'] }
